[workspace]
resolver = "2"
members = [
    "crates/quine-common",
    "crates/quine-llm",
    "crates/quine-eval",
    "crates/quine-evolution",
    "crates/quine-guardian",
    "crates/quine-cli",
    "benchmarks/quine-bench-simple",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/azmisahin-ai/quine"
authors = ["azmisahin-ai"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime & HTTP (local only – see Core Principle #2)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
rand = "0.8"
tempfile = "3"

# Internal crates
quine-common = { path = "crates/quine-common" }
quine-llm = { path = "crates/quine-llm" }
quine-eval = { path = "crates/quine-eval" }
quine-evolution = { path = "crates/quine-evolution" }
quine-guardian = { path = "crates/quine-guardian" }
quine-bench-simple = { path = "benchmarks/quine-bench-simple" }

[profile.release]
lto = "thin"
